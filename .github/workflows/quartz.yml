name: Build Quartz Site
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy vault to Quartz content
        run: |
          # Remove default content
          rm -rf quartz/content/*
          
          # Copy vault files to Quartz content
          cp -a vault/. quartz/content/
          
          # Remove internal repos/metadata from content
          rm -rf quartz/content/.git quartz/content/.github
          
          # Copy custom quartz config if it exists
          if [ -f "vault/.github/workflows/quartz/quartz.config.yaml" ]; then
            cp vault/.github/workflows/quartz/quartz.config.yaml quartz/quartz.config.yaml
          elif [ -f "vault/.github/quartz/quartz.config.yaml" ]; then
            cp vault/.github/quartz/quartz.config.yaml quartz/quartz.config.yaml
          fi

      - name: Install dependencies
        working-directory: quartz
        run: npm ci

      - name: Build Quartz
        working-directory: quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4